// /etc/kraken-lcd.conf -- Kraken Unleashed
//
// JSON, except that whole lines starting with // are stripped before parsing.
// Apply changes with:  sudo systemctl restart kraken-lcd
// Full guide: docs/CUSTOMISING.md
{
    // Background image. Any animated GIF, or a still PNG/JPEG. It is resized to
    // 640x640, so a square image with a DARK CENTRE works best -- the sensor
    // readout is lightened over the top of it.
    // null = the bundled assets/demo.gif
    "gif": null,

    // Which readout to draw: "triple", "liquid_ring" or "cpu_gpu".
    // See the screenshots in docs/CUSTOMISING.md.
    "style": "triple",

    // How far to dim the background so the numbers stay readable.
    // 0 = background at full brightness, 1 = black. 0.4 suits most GIFs.
    "dim": 0.4,

    // Colour of the liquid-temperature arc, hex RRGGBB.
    // Only the "liquid_ring" and "cpu_gpu" styles draw it.
    "ring": "7C3AED",

    // Frames per second. 12 is the practical ceiling for this panel; lower it
    // if you would rather spend less CPU (8 looks fine, 4 is noticeably steppy).
    "fps": 12,

    // Rotate the image so it is upright for how your cooler is mounted.
    // One of 0, 90, 180, 270. Try each and keep what looks right.
    "rotate": 90,

    // The cooler's own ring and fan LEDs.
    "led": {
        "enabled": true,

        // If this file exists, its colour/period/brightness/gamma are used
        // instead of the values below, so the cooler breathes in exact phase
        // with an rgb-sync install driving the rest of your lighting.
        // Set to null to ignore it and always use the values below.
        "follow": "/etc/rgb-sync.json",

        "color": "00FF00",
        "period": 5.0,
        "min_brightness": 0.0,
        "max_brightness": 1.0,
        "gamma": 2.2
    }
}
